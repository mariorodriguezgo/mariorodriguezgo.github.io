<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mario Rodríguez - Portfolio</title>
    <meta name="description" content="Portfolio de Mario Rodríguez - Administrador de Sistemas Junior | Técnico Informático">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="portfolio-data.js"></script>
    <style id="design-vars"></style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <span class="nav-logo">Mario Rodríguez</span>
            <div class="nav-controls">
                <div class="lang-selector">
                    <button class="lang-btn active" data-lang="es">ES</button>
                    <button class="lang-btn" data-lang="cat">CAT</button>
                    <button class="lang-btn" data-lang="en">EN</button>
                </div>
                <button id="theme-toggle" class="theme-toggle" aria-label="Cambiar tema">
                    <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
            </div>
        </div>
    </nav>

    <div class="container" id="main-container"></div>

    <script>
    const ICONS = {
        monitor:     `<rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line>`,
        terminal:    `<path d="M4 17s1-1 1-2V5a2 2 0 0 1 2-2h14v10l-4 4H4Z"></path>`,
        layers:      `<path d="M2 3h20"></path><path d="M21 3v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3"></path><path d="m7 21 5-5 5 5"></path>`,
        box:         `<rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><path d="M7 7h10"></path><path d="M7 12h10"></path><path d="M7 17h10"></path>`,
        network:     `<path d="M5 12V7a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v5"></path><path d="M12 5v14"></path><path d="M5 12h14"></path>`,
        shield:      `<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>`,
        cloud:       `<path d="M17.5 19a3.5 3.5 0 0 0 0-7c-.3 0-.63.02-.95.05A7 7 0 1 0 5 13L5 13a4 4 0 0 0 0 8h12.5Z"></path>`,
        briefcase:   `<rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>`,
        'file-text': `<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline>`,
        bookmark:    `<path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"></path><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"></path><path d="M18 12H10"></path>`,
        mail:        `<path d="M4 10h12"></path><path d="M4 14h9"></path><path d="M19 6a7.7 7.7 0 0 0-5.2-2A7.9 7.9 0 0 0 7 14a8 8 0 0 0 8 8 8 8 0 0 0 5-2"></path>`,
        globe:       `<path d="M12 22c6-12 6-15 6-18a6 6 0 1 0-12 0c0 3 0 6 6 18Z"></path><circle cx="12" cy="7" r="1.5"></circle>`,
        wrench:      `<path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"></path><path d="M4 12c-1.1 0-2-.9-2-2V7h20v3c0 1.1-.9 2-2 2"></path><path d="M10 16v-4"></path><path d="M14 16v-4"></path><path d="M18 16v-4"></path><path d="M6 16v-4"></path><path d="M11 16h2"></path>`,
        users:       `<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path>`,
        refresh:     `<path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path>`,
        lightbulb:   `<path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A5 5 0 0 0 8 8c0 1.3.5 2.6 1.5 3.5.8.8 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path>`,
        clock:       `<circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline>`,
        message:     `<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>`
    };

    function icon(name, size = 24) {
        return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name] || ICONS['box']}</svg>`;
    }

    function t(obj) {
        return (obj && obj[currentLang]) ? obj[currentLang] : (obj && obj['es']) ? obj['es'] : '';
    }

    function render() {
        const d = window.PORTFOLIO_DATA;
        document.getElementById('main-container').innerHTML = `
        <section id="hero" class="hero">
            <div class="hero-content">
                <span class="hero-tag">${t(d.hero.tag)}</span>
                <h1 class="hero-title">${t(d.hero.title)}</h1>
                <h2 class="hero-subtitle">${t(d.hero.subtitle)}</h2>
                <p class="hero-bio">${t(d.hero.bio)}</p>
                <div class="social-links">
                    <a href="mailto:${d.hero.email}" class="social-btn">
                        ${icon('mail', 18)} ${d.hero.email}
                    </a>
                    <a href="${d.hero.linkedin}" target="_blank" class="social-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path><rect x="2" y="9" width="4" height="12"></rect><circle cx="4" cy="4" r="2"></circle></svg>
                        LinkedIn
                    </a>
                </div>
            </div>
            <div class="hero-img-container">
                <img src="${d.hero.photo}" alt="Mario Rodríguez" class="hero-img">
            </div>
        </section>

        <section id="about">
            <div class="section-header">
                <svg class="section-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <h2 class="section-title">${t(d.about.title)}</h2>
            </div>
            <div class="card"><p class="description">${t(d.about.desc)}</p></div>
        </section>

        <section id="experience">
            <div class="section-header">
                <svg class="section-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
                <h2 class="section-title">${t(d.experience.sectionTitle)}</h2>
            </div>
            <div class="timeline-container">
                ${d.experience.items.map((item, i) => `
                <div class="timeline-item">
                    <div class="timeline-dot"></div>
                    <div class="card timeline-card animate-fade-in-up" ${i > 0 ? `style="animation-delay:${i*0.1}s"` : ''}>
                        <div class="timeline-card-header">
                            <div><h3 class="card-title">${t(item.title)}</h3><p class="subtitle">${item.company}</p></div>
                            <span class="timeline-date">${t(item.date)}</span>
                        </div>
                        ${item.bullets.length ? `<ul class="timeline-list">${item.bullets.map(b=>`<li>${t(b)}</li>`).join('')}</ul>` : ''}
                    </div>
                </div>`).join('')}
            </div>
        </section>

        <section id="education">
            <div class="section-header">
                <svg class="section-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c0 2 2 3 6 3s6-1 6-3v-5"></path></svg>
                <h2 class="section-title">${t(d.education.sectionTitle)}</h2>
            </div>
            <div class="timeline-container">
                ${d.education.items.map((item, i) => `
                <div class="timeline-item">
                    <div class="timeline-dot"></div>
                    <div class="card timeline-card animate-fade-in-up" ${i > 0 ? `style="animation-delay:${i*0.1}s"` : ''}>
                        <div class="timeline-card-header">
                            <div><h3 class="card-title">${t(item.title)}</h3><p class="subtitle">${item.institution}</p></div>
                            <span class="timeline-date">${t(item.date)}</span>
                        </div>
                        ${item.bullets.length ? `<ul class="timeline-list">${item.bullets.map(b=>`<li>${t(b)}</li>`).join('')}</ul>` : ''}
                    </div>
                </div>`).join('')}
            </div>
        </section>

        <section id="skills">
            <div class="section-header">
                <svg class="section-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"></path><path d="M2 17l10 5 10-5"></path><path d="M2 12l10 5 10-5"></path></svg>
                <h2 class="section-title">${t(d.skills.sectionTitle)}</h2>
            </div>
            <div class="skills-grid">
                ${d.skills.categories.map(cat => `
                <div class="card skill-card">
                    <h3 class="skill-cat-title">${t(cat.title)}</h3>
                    <ul class="skill-list">
                        ${cat.items.map(sk => `
                        <li class="skill-list-item">
                            <svg class="skill-item-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[sk.icon] || ICONS['box']}</svg>
                            <span>${t(sk.text)}</span>
                        </li>`).join('')}
                    </ul>
                </div>`).join('')}
            </div>
        </section>

        <section id="certificates">
            <div class="section-header">
                <svg class="section-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15 8 22 9 17 14 18 21 12 17 6 21 7 14 2 9 9 8 12 2"></polygon></svg>
                <h2 class="section-title">${t(d.certificates.sectionTitle)}</h2>
            </div>
            <div class="certificates-grid">
                ${d.certificates.items.map((cert, i) => `
                <a href="${cert.url}" target="_blank" class="card cert-card animate-fade-in-up" ${i > 0 ? `style="animation-delay:${i*0.1}s"` : ''}>
                    <img src="${cert.image}" alt="${t(cert.title)}" class="cert-img">
                    <div class="cert-content">
                        <h3 class="skill-cat-title">${t(cert.title)}</h3>
                        <p class="text-secondary">${t(cert.issuer)}</p>
                    </div>
                </a>`).join('')}
            </div>
        </section>

        <section id="projects">
            <div class="section-header">
                <svg class="section-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                <h2 class="section-title">${t(d.projects.sectionTitle)}</h2>
            </div>
            <div class="projects-grid">
                ${d.projects.items.map((proj, i) => `
                <a href="${proj.link}?lang=${currentLang}" class="card project-card animate-fade-in-up" ${i > 0 ? `style="animation-delay:${i*0.1}s"` : ''}>
                    <h3 class="card-title">${t(proj.title)}</h3>
                    <p class="text-secondary" style="margin-top:0.75rem;font-size:0.95rem;">${t(proj.desc)}</p>
                    <span class="project-link">${t(d.projects.linkText)}</span>
                </a>`).join('')}
            </div>
        </section>`;
    }

    // Apply meta title & description
    (function applyMeta() {
        const m = window.PORTFOLIO_DATA && window.PORTFOLIO_DATA.meta;
        if (!m) return;
        if (m.title) document.title = m.title;
        const desc = document.querySelector('meta[name="description"]');
        const lang = localStorage.getItem('lang') || 'es';
        if (desc && m.description && m.description[lang]) desc.setAttribute('content', m.description[lang]);
    })();

    // Apply design variables from data
    (function applyDesign() {
        const dz = window.PORTFOLIO_DATA && window.PORTFOLIO_DATA.design;
        if (!dz) return;
        document.getElementById('design-vars').textContent =
            `:root { --accent-color: ${dz.accentColor || '#10b981'}; --accent-secondary: ${dz.accentSecondary || '#3b82f6'}; }`;
        if (!localStorage.getItem('theme')) {
            document.documentElement.setAttribute('data-theme', dz.defaultTheme || 'dark');
        }
        const logo = document.querySelector('.nav-logo');
        if (logo && dz.navName) logo.textContent = dz.navName;
    })();

    // Theme
    const themeToggle = document.getElementById('theme-toggle');
    document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || (window.PORTFOLIO_DATA && window.PORTFOLIO_DATA.design && window.PORTFOLIO_DATA.design.defaultTheme) || 'dark');
    themeToggle.addEventListener('click', () => {
        const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
    });

    // Language
    let currentLang = new URLSearchParams(window.location.search).get('lang') || localStorage.getItem('lang') || 'es';

    function setLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('lang', lang);
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
        render();
    }

    document.querySelectorAll('.lang-btn').forEach(btn =>
        btn.addEventListener('click', () => setLanguage(btn.dataset.lang))
    );

    setLanguage(currentLang);
    </script>
</body>
</html>
