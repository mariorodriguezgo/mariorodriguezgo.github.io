<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Mario Rodríguez</title>
  <link rel="stylesheet" href="/css/style.css?v=24">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=IBM+Plex+Sans:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body{display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:2rem}
    .e404{max-width:480px}
    .e404-code{font-family:var(--f-disp);font-size:clamp(5rem,18vw,9rem);font-weight:800;letter-spacing:-.05em;color:var(--accent);line-height:1}
    .e404-mono{font-family:var(--f-mono);font-size:.78rem;color:var(--text-3);letter-spacing:.1em;text-transform:uppercase;margin:.5rem 0 1.5rem}
    .e404-title{font-family:var(--f-disp);font-size:1.5rem;font-weight:700;color:var(--text);margin-bottom:.75rem;letter-spacing:-.02em}
    .e404-text{font-size:.92rem;color:var(--text-2);margin-bottom:2rem;line-height:1.7}
    .e404-btn{display:inline-flex;align-items:center;gap:.5rem;background:var(--accent);color:#fff;font-family:var(--f-mono);font-size:.8rem;font-weight:600;padding:.7rem 1.5rem;border-radius:100px;letter-spacing:.03em;transition:transform .2s,box-shadow .2s;box-shadow:0 4px 16px rgba(var(--accent-rgb),.3)}
    .e404-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(var(--accent-rgb),.4)}
  </style>
</head>
<body>
  <div class="e404">
    <div class="e404-code">404</div>
    <div class="e404-mono">$ cd /pagina-no-encontrada → error</div>
    <h1 class="e404-title">Esta ruta no existe</h1>
    <p class="e404-text">La página que buscas no está aquí. Puede que el enlace sea antiguo o esté mal escrito.</p>
    <a href="/index.html" class="e404-btn">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Volver al inicio
    </a>
  </div>
  <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('theme')||'light');</script>
</body>
</html>
